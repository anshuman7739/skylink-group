{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — Skylink Group</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
  <link rel="stylesheet" href="{% static 'css/skylink.css' %}">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-gray-200 p-8 sm:p-10">
    
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-block p-2 bg-blue-50 rounded-2xl mb-4">
        <img src="{% static 'images/logo.svg' %}" alt="Skylink Group" class="h-12 w-auto mx-auto">
      </div>
      <h1 class="text-xl font-black text-[#1B2B6B]">Administration Portal</h1>
      <p class="text-xs text-gray-500 mt-1">Authorized personnel login only</p>
    </div>

    <!-- Flash message -->
    {% if messages %}
    <div class="mb-6 space-y-2">
      {% for message in messages %}
      <div class="p-3 text-xs font-semibold rounded-xl {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-200{% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'submissions:admin_login' %}" class="space-y-5">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Staff Username *</label>
        <input type="text" name="username" required autofocus class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1B2B6B] focus:border-[#1B2B6B] outline-none text-sm transition" placeholder="Username">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">Secure Password *</label>
        <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1B2B6B] focus:border-[#1B2B6B] outline-none text-sm transition" placeholder="••••••••••••">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full py-3.5 bg-[#1B2B6B] hover:bg-[#121E4B] text-white font-extrabold text-xs uppercase tracking-wider rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Authenticate & Enter Dashboard
        </button>
      </div>
    </form>

    <div class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
      <a href="{% url 'core:home' %}" class="hover:text-gray-700 transition flex items-center">
        ← Return to Public Site
      </a>
      <span class="font-mono text-[11px]">Django Auth</span>
    </div>

  </div>
</body>
</html>
